name: API Tests (sharded + self-healing)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Shard ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      TEST_ENV: staging
      # Secrets injected from the vault — NEVER hardcoded.
      BOOKER_USERNAME: ${{ secrets.BOOKER_USERNAME }}
      BOOKER_PASSWORD: ${{ secrets.BOOKER_PASSWORD }}
      REQUEST_MIN_INTERVAL_MS: '200'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright test --shard=${{ matrix.shard }}/8 --reporter=list,json,allure-playwright
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-shard-${{ matrix.shard }}
          path: |
            test-results/
            allure-results/
          retention-days: 7

  heal:
    name: Self-heal on failure
    needs: test
    if: failure()
    runs-on: ubuntu-latest
    env:
      TEST_ENV: staging
      BOOKER_USERNAME: ${{ secrets.BOOKER_USERNAME }}
      BOOKER_PASSWORD: ${{ secrets.BOOKER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: results-shard-*
          merge-multiple: true
      - name: Run healer
        run: npm run heal
      - name: Upload healing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healing-report
          path: healing-report.md

  report:
    name: Allure report
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: results-shard-*
          merge-multiple: true
          path: allure-results
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx allure-commandline generate allure-results --clean -o allure-report
      - uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
